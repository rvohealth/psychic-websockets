# SECURITY — allowBuilds is a supply-chain allowlist. pnpm 10+ blocks ALL
# dependency lifecycle scripts (postinstall, etc.) by default; that default is
# the primary defense against Shai-Hulud-class npm worms. Only packages listed
# below (= true) may run install/build scripts. Keep this MINIMAL — every entry
# re-opens script execution for that package, so add one only with clear cause.
strictDepBuilds: false
allowBuilds:
  esbuild: false
  msgpackr-extract: false
  puppeteer: false

# SECURITY — release-age cooldown: 3 days, in minutes. Freshly published
# versions are not installed until they are this old (the window in which most
# worm-injected releases are caught and unpublished). Kept under the CVE-patch
# SLA so routine patching needs no bypass. pnpm 11+ reads this only from
# pnpm-workspace.yaml (it ignores it in .npmrc); client/pnpm-workspace.yaml
# repeats it because client/ is a separate project that does not inherit it.
minimumReleaseAge: 4320

# We maintain the @rvoh packages, so a fresh publish of one of them is not an
# upstream supply-chain risk to wait out. Keep this list @rvoh/* only
# (reviewed like any other change).
minimumReleaseAgeExclude:
  - '@rvoh/*'
