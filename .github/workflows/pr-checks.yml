name: PR Checks
on:
  - pull_request

permissions:
  actions: none
  attestations: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: read
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  check-cooldown-excludes:
    name: Cooldown exclude allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: minimumReleaseAgeExclude must be @rvoh/* only
        run: |
          # SECURITY: the minimumReleaseAge cooldown bypass list must stay @rvoh/*
          # only (our own packages). Any third-party entry is a permanent
          # supply-chain bypass and must be rejected — apply urgent patches via a
          # transient, reverted override instead of a persistent exclude.
          bad=$(grep -nE '^[[:space:]]*minimumReleaseAgeExclude' .npmrc | grep -vE '=[[:space:]]*@rvoh/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-@rvoh minimumReleaseAgeExclude entries (cooldown bypass must stay @rvoh/* only):"
            echo "$bad"
            exit 1
          fi

  uspec:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 26 is the primary target; Node 24 is the supported floor.
        node-version: ["26", "24"]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      PSYCHIC_CORE_DEVELOPMENT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm uspec

  fspec:
    name: Feature tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 26 is the primary target; Node 24 is the supported floor.
        node-version: ["26", "24"]
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      TZ: UTC
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      PSYCHIC_CORE_DEVELOPMENT: 1
      WS_PORT: 8889
      VITE_WS_PORT: 8889
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: install client packages
        run: pnpm install --frozen-lockfile
        working-directory: ./client

      - name: install puppeteer browsers
        run: pnpm puppeteer browsers install firefox

      - name: make screenshots dir
        run: mkdir -p /tmp/screenshots

      - name: run migrations
        run: pnpm psy db:migrate --skip-sync

      - name: run feature specs
        run: pnpm fspec

      - name: Archive screenshots
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: Feature spec screenshots (Node ${{ matrix.node-version }})
          path: /tmp/screenshots

  lint:
    name: Linting
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check-build:
    name: Check build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 26 is the primary target; Node 24 is the supported floor.
        node-version: ["26", "24"]
    env:
      NODE_ENV: development
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: built ESM and CJS exports load on this Node version
        run: |
          node --input-type=module -e "import * as m from '@rvoh/psychic-websockets'; import * as t from '@rvoh/psychic-websockets/testing'; if (typeof m.Cable !== 'function' || !Object.keys(t).length) process.exit(1)"
          node -e "const m = require('@rvoh/psychic-websockets'); const t = require('@rvoh/psychic-websockets/testing'); if (typeof m.Cable !== 'function' || !Object.keys(t).length) process.exit(1)"

      - name: install and build client
        run: pnpm install --frozen-lockfile && pnpm build && pnpm lint
        working-directory: ./client

  check-no-sync-diff:
    name: Ensure no sync diffs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: psychic
          POSTGRES_DB: psychic_core_test
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:6.2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      PORT: 7777
      DB_USER: psychic
      DB_NAME: psychic_core_test
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_PORT: 5432
      TZ: UTC
      GITHUB_OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      PSYCHIC_CORE_DEVELOPMENT: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm psy db:migrate --skip-sync
      - run: pnpm psy sync
      - name: Check for sync differences
        run: |
          if [ -n "$(git diff)" ]; then
            echo "Error: 'pnpm psy sync' produced changes. Please run 'pnpm psy sync' locally and commit the changes."
            echo "Changes detected:"
            git diff
            exit 1
          else
            echo "No changes detected after sync - all good!"
          fi
